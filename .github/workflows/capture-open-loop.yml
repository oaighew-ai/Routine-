# Continuous polling across the hours the exchange actually opens its board.
#
# `capture.yml` asks cron to fire every fifteen minutes and polls three times
# around each trigger. That is the right shape when the triggers arrive. They
# do not: across one observed window GitHub delivered one run out of roughly
# twelve requested slots, which leaves hours with no poll at all.
#
# That gap is fatal to the only measurement this project wants. A row grades
# `true_open` only when its first sighting falls within
# `TRUE_OPEN_MAX_LAG_SECONDS` (fifteen minutes) of Kalshi's own `open_time`.
# Hoping a fifteen-minute cron lands inside a fifteen-minute tolerance, at
# one-in-twelve delivery, is not a plan. Widening the window (PR #67) put the
# polling in the right hours; it did nothing about whether a poll happens.
#
# So this asks cron for long-lived launches and does the waiting itself. The
# chain covers the entire measured Friday-evening-through-Tuesday release band.
# The Sep 25-26 cohort opened Sat/Sun; the Oct 2-3 cohort began Friday evening
# US time (Sat 01:06 UTC) and kept posting through Monday night. A Sunday-only
# loop therefore cannot be called prospective.
#
# Cron is only the backstop now. Scheduled launches in this repository arrive
# hours late (the 13:30 UTC feature capture landed at 18:44, 18:29 and 18:57
# on three consecutive days), and a late launch is a hole in the chain. So a
# link that ran its slot hands over to the next one itself with
# workflow_dispatch, which is not delayed. One launch that arrives is enough
# to carry the chain to the close of the window; the crons restart it if a
# link dies.
#
# Each live poll is also handed to CFB_EDGE_PROSPECTIVE_OPEN_V1. That contract
# freezes the first valid two-sided state immediately and never upgrades a late
# row from historical data.
#
# A dropped launch now costs one link in the chain rather than every poll in
# it, and `capture.yml` keeps its own schedule underneath as a fallback: if
# none of these start, the fifteen-minute crons still run.
name: capture open loop

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/capture-open-loop.yml
      - cfb_edge/prospective_open.py
      - cfb_edge/watch.py
      - cfb_edge/providers/kalshi.py
  schedule:
    # Cron numbers days from Sunday: 5 is Friday, 6 is Saturday, 0 is Sunday.
    # Each launch begins no later than the previous one ends. A test pins the
    # chain against RELEASE_WINDOW_UTC and against the measured open band.
    - cron: "0 18 * 9-11 5"    # Fri 18:00, when the release window opens
    - cron: "30 23 * 9-11 5"   # Fri 23:30
    - cron: "0 5 * 9-11 6"     # Sat 05:00
    - cron: "30 10 * 9-11 6"   # Sat 10:30
    - cron: "0 12 * 9-11 6"    # Sat 12:00
    - cron: "30 17 * 9-11 6"   # Sat 17:30
    - cron: "0 23 * 9-11 6"    # Sat 23:00
    - cron: "30 4 * 9-11 0"    # Sun 04:30
    - cron: "0 10 * 9-11 0"    # Sun 10:00
    - cron: "30 15 * 9-11 0"   # Sun 15:30
    - cron: "0 21 * 9-11 0"    # Sun 21:00
    - cron: "30 2 * 9-11 1"    # Mon 02:30
    - cron: "0 8 * 9-11 1"     # Mon 08:00
    - cron: "30 13 * 9-11 1"   # Mon 13:30
    - cron: "0 19 * 9-11 1"    # Mon 19:00
    - cron: "30 0 * 9-11 2"    # Tue 00:30
    - cron: "0 6 * 9-11 2"     # Tue 06:00
    - cron: "30 11 * 9-11 2"   # Tue 11:30
    - cron: "30 16 * 9-11 2"   # Tue 16:30; loop exits at release close
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # the hand-over below dispatches the next link

# The same group `capture.yml` uses. Two pollers pushing the same log would
# race and one would lose its poll. While a loop holds the group the ordinary
# fifteen-minute runs queue behind it, and GitHub keeps at most one pending,
# so they cannot pile up.
concurrency:
  group: cfb-capture
  cancel-in-progress: false

env:
  # One-minute live observation while the board is expected to post. The venue
  # timestamp remains authoritative; this only minimizes first-observation lag.
  POLL_INTERVAL_SECONDS: "60"
  # Five and a half hours. The hosted-runner ceiling is six, and the final
  # report and push need room after the loop stops.
  LOOP_MINUTES: "330"
  # Push the accumulated log at least this often even when no new market
  # appeared, so a runner that dies does not take the movement record with it.
  FORCE_PUSH_EVERY_POLLS: "10"
  # A link shorter than this does not hand over. A link that fails at once
  # would otherwise dispatch its successor at once, and so on for the whole
  # window.
  MIN_HANDOVER_SECONDS: "600"

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Code
        uses: actions/checkout@v4

      - name: The log so far
        uses: actions/checkout@v4
        with:
          ref: capture-data
          path: capture-data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the slate for the week that can still be captured
        id: slate
        run: |
          set -o pipefail
          set +e
          python3 -m cfb_edge.slate --season "$(date -u +%Y)" --week opening \
            --out capture-data/data/slate_current.csv 2>&1 | tee /tmp/slate.log
          rc=$?
          set -e
          case "$rc" in
            0)
              echo "ok=1" >> "$GITHUB_OUTPUT"
              WEEK="$(awk '/^week [0-9]+ / {print $2; exit}' /tmp/slate.log)"
              if ! [[ "$WEEK" =~ ^[0-9]+$ ]]; then
                echo "Could not resolve opening provider week from slate output." >&2
                exit 1
              fi
              echo "provider_week=$WEEK" >> "$GITHUB_OUTPUT"
              echo "cohort_id=CFB_$(date -u +%Y)_PROVIDER_WEEK_${WEEK}" >> "$GITHUB_OUTPUT"
              ;;
            3)
              echo "ok=0" >> "$GITHUB_OUTPUT"
              echo "No week is open for capture; nothing to poll." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "Slate generation failed; see logs. No successful capture claimed." >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac

      # The week being played, for closes. From Friday evening the slate above
      # is next week's, and nothing else watches this week's games as they
      # kick off: on 2026-10-03 no frozen Week 6 game had a price within
      # fifteen minutes of its kickoff (D44). Its games join the poll only
      # when kickoff is near. Built aside and moved into place, so a failed
      # build leaves the last good file, and not fatal, so a link that cannot
      # build it still captures opens.
      - name: Build the slate for the week being played
        if: steps.slate.outputs.ok == '1'
        run: |
          set +e
          python3 -m cfb_edge.slate --season "$(date -u +%Y)" --week current \
            --out "$RUNNER_TEMP/slate_playing.csv" > /tmp/playing.log 2>&1
          rc=$?
          set -e
          cat /tmp/playing.log
          if [ "$rc" -eq 0 ] && [ -s "$RUNNER_TEMP/slate_playing.csv" ]; then
            mv "$RUNNER_TEMP/slate_playing.csv" capture-data/data/slate_playing.csv
            echo "- closes: polling the week being played near each kickoff" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- closes: no new slate for the week being played (exit $rc); the last good one is used if present" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Poll continuously until the launch's slot ends
        id: loop
        if: steps.slate.outputs.ok == '1'
        run: |
          set -u
          git -C capture-data config user.name  "github-actions[bot]"
          git -C capture-data config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          deadline=$(( $(date -u +%s) + LOOP_MINUTES * 60 ))
          echo "started=$(date -u +%s)" >> "$GITHUB_OUTPUT"
          polls=0; pushes=0; failures=0; since_push=0

          # Every successful poll's snapshot is kept here until a push carries
          # it. Other workflows commit to capture-data outside this job's
          # concurrency group, so a push can be rejected at any time. Taking
          # their branch is still right (forcing would replace an earlier
          # first-seen with a later one), but the polls we had not pushed are
          # then replayed on top at their original observation time instead of
          # being thrown away. Before this, a lost push cost the poll, and a
          # market that opened in it was first seen a poll later or not at all.
          UNPUSHED="$RUNNER_TEMP/unpushed"
          mkdir -p "$UNPUSHED"
          COHORT_ID="${{ steps.slate.outputs.cohort_id }}"
          PROS_DIR="capture-data/data/open-capture/$COHORT_ID"
          mkdir -p "$PROS_DIR/evidence"

          replay_unpushed () {
            local f n=0
            for f in $(ls "$UNPUSHED"/*.json 2>/dev/null | sort); do
              python3 -m cfb_edge.watch --log capture-data/data/opens.jsonl.gz \
                --out capture-data/data/opens.csv --replay-snapshot "$f" || return 1
              python3 -m cfb_edge.prospective_open --snapshot "$f" \
                --slate capture-data/data/slate_current.csv --cohort-id "$COHORT_ID" \
                --out "$PROS_DIR/status.json" \
                --latest-out capture-data/data/prospective-open-status.json \
                --evidence-dir "$PROS_DIR/evidence" --revision "$GITHUB_SHA" || return 1
              n=$((n + 1))
            done
            echo "replayed $n unpushed poll(s) onto the moved branch"
          }

          persist () {
            local message="$1" attempt
            for attempt in 1 2 3; do
              git -C capture-data add -A data
              if git -C capture-data diff --cached --quiet; then
                rm -f "$UNPUSHED"/*.json
                return 1
              fi
              git -C capture-data commit -q -m "$message"
              if git -C capture-data push -q 2>/dev/null; then
                rm -f "$UNPUSHED"/*.json
                return 0
              fi
              echo "push rejected (attempt $attempt); taking the branch and replaying unpushed polls"
              git -C capture-data reset --hard -q HEAD~1
              git -C capture-data fetch -q origin capture-data
              git -C capture-data reset --hard -q origin/capture-data
              if ! replay_unpushed; then
                echo "replay failed; the polls stay queued for the next push"
                return 1
              fi
            done
            return 1
          }

          while [ "$(date -u +%s)" -lt "$deadline" ]; do
            polls=$((polls + 1))
            since_push=$((since_push + 1))

            if ! python3 -c 'from datetime import datetime, timezone; from cfb_edge.watch import in_release_window; raise SystemExit(0 if in_release_window(datetime.now(timezone.utc)) else 1)'; then
              echo "release window closed; ending this chain link"
              break
            fi

            # Games of the week being played join the poll only inside the
            # closing window, so this is the same single board read either way.
            CLOSING=()
            if [ -s capture-data/data/slate_playing.csv ]; then
              CLOSING=(--closing-slate capture-data/data/slate_playing.csv)
            fi

            SNAPSHOT="/tmp/kalshi-live-poll.json"
            if ! python3 -m cfb_edge.watch --source kalshi \
                   --slate capture-data/data/slate_current.csv \
                   ${CLOSING[@]+"${CLOSING[@]}"} \
                   --log capture-data/data/opens.jsonl.gz \
                   --out capture-data/data/opens.csv \
                   --snapshot-out "$SNAPSHOT" --once; then
              failures=$((failures + 1))
              echo "poll $polls failed; continuing"
            else
              cp "$SNAPSHOT" "$UNPUSHED/$(date -u +%s%N).json"
              python3 -m cfb_edge.prospective_open \
                --snapshot "$SNAPSHOT" \
                --slate capture-data/data/slate_current.csv \
                --cohort-id "$COHORT_ID" \
                --out "$PROS_DIR/status.json" \
                --latest-out capture-data/data/prospective-open-status.json \
                --evidence-dir "$PROS_DIR/evidence" \
                --revision "$GITHUB_SHA"
            fi

            TRANSITIONS="$(python3 -c 'import json; from pathlib import Path; p=Path("capture-data/data/prospective-open-status.json"); print(0 if not p.exists() else int((json.loads(p.read_text()).get("summary") or {}).get("newTransitions") or 0))')"

            # A newly locked prospective open or a legacy first-seen is
            # irreplaceable evidence, so persist it immediately.
            if [ "$TRANSITIONS" -gt 0 ] || ! git -C capture-data diff --quiet -- data/opens.csv; then
              persist "capture open loop: prospective lock $(date -u '+%Y-%m-%d %H:%M UTC')" \
                && { pushes=$((pushes + 1)); since_push=0; }
            elif [ "$since_push" -ge "$FORCE_PUSH_EVERY_POLLS" ]; then
              persist "capture open loop: log $(date -u '+%Y-%m-%d %H:%M UTC')" \
                && { pushes=$((pushes + 1)); since_push=0; } || since_push=0
            fi

            remaining=$(( deadline - $(date -u +%s) ))
            [ "$remaining" -le "$POLL_INTERVAL_SECONDS" ] && break
            sleep "$POLL_INTERVAL_SECONDS"
          done

          echo "polls=$polls"       >> "$GITHUB_OUTPUT"
          echo "pushes=$pushes"     >> "$GITHUB_OUTPUT"
          echo "failures=$failures" >> "$GITHUB_OUTPUT"

      # The next link is asked for here, before the report and the final push,
      # so it is already queued when this job ends. It cannot start early: both
      # runs are in the `cfb-capture` group. Three guards keep a broken link
      # from re-launching itself in a tight circle: the loop step finished, at
      # least one poll succeeded, and the link ran for MIN_HANDOVER_SECONDS.
      # Anything else is left to the crons above.
      - name: Hand over to the next link
        if: ${{ !cancelled() && steps.slate.outputs.ok == '1' && steps.loop.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          POLLS: ${{ steps.loop.outputs.polls }}
          FAILURES: ${{ steps.loop.outputs.failures }}
          STARTED: ${{ steps.loop.outputs.started }}
          REF: ${{ github.ref_name }}
        run: |
          set -u
          now=$(date -u +%s)
          ran=$(( now - ${STARTED:-$now} ))
          good=$(( ${POLLS:-0} - ${FAILURES:-0} ))
          note () { echo "$1"; echo "- hand-over: $1" >> "$GITHUB_STEP_SUMMARY"; }
          if [ "$good" -lt 1 ]; then
            note "no successful poll in this link; the restart is left to cron"
            exit 0
          fi
          if [ "$ran" -lt "$MIN_HANDOVER_SECONDS" ]; then
            note "this link ran ${ran}s, under ${MIN_HANDOVER_SECONDS}s; the restart is left to cron"
            exit 0
          fi
          if ! python3 -m cfb_edge.watch --window-open ${HANDOVER_AT:+--at "$HANDOVER_AT"}; then
            note "release window closed; the chain ends here"
            exit 0
          fi
          if gh workflow run capture-open-loop.yml --ref "$REF"; then
            note "next link dispatched on $REF"
          else
            note "dispatch failed; the restart is left to cron"
          fi

      - name: Build read-only capture report
        if: steps.slate.outputs.ok == '1'
        env:
          CAPTURE_OUTCOME: ${{ steps.loop.outcome }}
        run: |
          python3 -m cfb_edge.capture_report \
            --log capture-data/data/opens.jsonl.gz \
            --slate capture-data/data/slate_current.csv \
            --out capture-data/data \
            --capture-outcome "$CAPTURE_OUTCOME" --revision "$GITHUB_SHA"

      - name: Build offline diagnostics (live picks belong to the private Site)
        if: steps.slate.outputs.ok == '1'
        run: |
          args=(
            --authority config/delivery_authority.json
            --registry config/model_registry.json
            --capture-report capture-data/data/capture-report.json
            --previous capture-data/data/picks-diagnostic.json
            --out capture-data/data/picks-diagnostic.json
            --revision "$GITHUB_SHA"
          )
          if [ -f capture-data/ledger/candidates.jsonl ]; then
            args+=(--candidates capture-data/ledger/candidates.jsonl)
          fi
          python3 -m cfb_edge.source_of_truth "${args[@]}"

      - name: Record what the loop produced
        if: steps.slate.outputs.ok == '1'
        run: |
          GAMES=$(( $(wc -l < capture-data/data/opens.csv) - 1 ))
          # The count that decides everything: only true_open rows grade.
          TRUE_OPEN=$(awk -F, 'NR>1 && $3=="true_open"' capture-data/data/opens.csv | wc -l)
          {
            echo "last poll : $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "run       : ${{ github.run_id }} (open loop)"
            echo "games with a first-seen line: $GAMES"
            echo "true_open rows: $TRUE_OPEN"
          } > capture-data/data/status.txt
          {
            echo "### capture open loop"
            echo "- polls: **${{ steps.loop.outputs.polls }}** (failed: ${{ steps.loop.outputs.failures }})"
            echo "- pushes: **${{ steps.loop.outputs.pushes }}**"
            echo "- games with a first-seen line: **$GAMES**"
            echo "- **true_open rows: $TRUE_OPEN** — the only rows that grade"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep it
        if: steps.slate.outputs.ok == '1'
        run: |
          set -u
          git -C capture-data config user.name  "github-actions[bot]"
          git -C capture-data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          UNPUSHED="$RUNNER_TEMP/unpushed"
          mkdir -p "$UNPUSHED"
          COHORT_ID="${{ steps.slate.outputs.cohort_id }}"
          PROS_DIR="capture-data/data/open-capture/$COHORT_ID"
          mkdir -p "$PROS_DIR/evidence"
          for attempt in 1 2 3; do
            git -C capture-data add -A data
            if git -C capture-data diff --cached --quiet; then
              echo "nothing new since the last push in the loop" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git -C capture-data commit -q -m "capture open loop: close $(date -u '+%Y-%m-%d %H:%M UTC')"
            if git -C capture-data push; then
              rm -f "$UNPUSHED"/*.json
              exit 0
            fi
            # Take the branch as it is, then replay the polls this run never
            # pushed, at the times they were observed. No fresh poll stands in
            # for a lost one.
            echo "push rejected, replaying unpushed polls (attempt $attempt)"
            git -C capture-data reset --hard -q HEAD~1
            git -C capture-data fetch -q origin capture-data
            git -C capture-data reset --hard -q origin/capture-data
            for f in $(ls "$UNPUSHED"/*.json 2>/dev/null | sort); do
              python3 -m cfb_edge.watch --log capture-data/data/opens.jsonl.gz \
                --out capture-data/data/opens.csv --replay-snapshot "$f"
              python3 -m cfb_edge.prospective_open --snapshot "$f" \
                --slate capture-data/data/slate_current.csv --cohort-id "$COHORT_ID" \
                --out "$PROS_DIR/status.json" \
                --latest-out capture-data/data/prospective-open-status.json \
                --evidence-dir "$PROS_DIR/evidence" --revision "$GITHUB_SHA"
            done
          done
          echo "could not push after three attempts; unpushed polls remain in the job log only" >> "$GITHUB_STEP_SUMMARY"
          exit 1
