name: Week 6 CLV close capture and grading

on:
  schedule:
    - cron: "*/15 20-23 * 9-11 4,5,6"
    - cron: "*/15 0-6 * 9-11 5,6,0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cfb-week6-clv-close-grade
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - name: Code
        uses: actions/checkout@v4

      - name: Evidence
        uses: actions/checkout@v4
        with:
          ref: capture-data
          path: evidence

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve active game window
        id: active
        run: |
          set -euo pipefail
          python3 -m cfb_edge.cohort status             --config config/br2_active_cohort.json             --mode game > /tmp/game.env
          cat /tmp/game.env >> "$GITHUB_OUTPUT"
          cat /tmp/game.env >> "$GITHUB_STEP_SUMMARY"

      - name: Validate frozen prerequisites
        if: steps.active.outputs.run == '1'
        run: |
          set -euo pipefail
          test -f evidence/data/week6-clv-decision-freeze.json
          test -f evidence/data/week6_2026_slate.csv
          test -f evidence/data/opens.jsonl.gz
          python3 -m cfb_edge.cohort validate-slate             --config config/br2_active_cohort.json             --slate evidence/data/week6_2026_slate.csv >> "$GITHUB_STEP_SUMMARY"

      - name: Poll close state
        if: steps.active.outputs.run == '1'
        run: |
          set -euo pipefail
          CLOSE_LOG="$RUNNER_TEMP/week6-clv-close-log.jsonl.gz"
          CLOSE_CAPTURE_DIR="evidence/data/week6-clv-close-capture"
          cp evidence/data/opens.jsonl.gz "$CLOSE_LOG"
          mkdir -p "$CLOSE_CAPTURE_DIR"
          echo "WEEK6_CLV_CLOSE_LOG=$CLOSE_LOG" >> "$GITHUB_ENV"

          for attempt in 1 2 3; do
            SNAPSHOT="$CLOSE_CAPTURE_DIR/run-${GITHUB_RUN_ID}-attempt-${attempt}.json"
            python3 -m cfb_edge.watch --source kalshi               --slate evidence/data/week6_2026_slate.csv               --log "$CLOSE_LOG"               --snapshot-out "$SNAPSHOT" --once
            [ "$attempt" -eq 3 ] || sleep 240
          done

      - name: Build close report from append-only log
        if: steps.active.outputs.run == '1'
        run: |
          set -euo pipefail
          python3 -m cfb_edge.week6_clv close-report             --freeze config/week6_clv_freeze.json             --log "$WEEK6_CLV_CLOSE_LOG"             --maximum-close-age-seconds 900             --out evidence/data/week6-clv-close-report.json

      - name: Grade frozen decisions against closes
        if: steps.active.outputs.run == '1'
        run: |
          set -euo pipefail
          python3 -m cfb_edge.signal_grader             --signals evidence/data/week6-clv-decision-freeze.json             --capture-report evidence/data/week6-clv-close-report.json             --maximum-close-age-seconds 900             --out evidence/data/week6-clv-grades.json

      - name: Run registered CLV gates
        if: steps.active.outputs.run == '1'
        run: |
          set -euo pipefail
          python3 -m cfb_edge.week6_clv clv-csv             --grades evidence/data/week6-clv-grades.json             --cohort DIRECTIONAL_SIGNAL             --week 6             --out evidence/data/week6-clv-directional.csv
          python3 -m cfb_edge.week6_clv clv-csv             --grades evidence/data/week6-clv-grades.json             --cohort EXECUTABLE_SHADOW             --week 6             --out evidence/data/week6-clv-executable.csv

          python3 -m cfb_edge.clv_gate             --observations evidence/data/week6-clv-directional.csv             --json > evidence/data/week6-clv-directional-gate.json
          python3 -m cfb_edge.clv_gate             --observations evidence/data/week6-clv-executable.csv             --json > evidence/data/week6-clv-executable-gate.json

      - name: Rerun registered authority gates
        if: steps.active.outputs.run == '1'
        run: |
          set -euo pipefail
          python3 -m cfb_edge.authority_gate_audit             --authority config/delivery_authority.json             --clv-grades evidence/data/week6-clv-grades.json             --out evidence/data/authority-gate-audit.json

          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          c=json.loads(Path("evidence/data/week6-clv-close-report.json").read_text())
          g=json.loads(Path("evidence/data/week6-clv-grades.json").read_text())
          a=json.loads(Path("evidence/data/authority-gate-audit.json").read_text())
          dg=json.loads(Path("evidence/data/week6-clv-directional-gate.json").read_text())
          eg=json.loads(Path("evidence/data/week6-clv-executable-gate.json").read_text())
          print("## Week 6 prospective CLV")
          print(f"- frozen recovered opens: **{c['summary']['frozenOpenRows']}**")
          print(f"- gradeable closes: **{c['summary']['gradeableCloseRows']}**")
          print(f"- signal rows: **{g['summary']['signalRows']}**")
          print(f"- gradeable signal rows: **{g['summary']['gradeableRows']}**")
          print(f"- directional mean CLV: **{g['summary']['directionalSignal']['meanLineClvPoints']}**")
          print(f"- directional beat-close rate: **{g['summary']['directionalSignal']['beatCloseRate']}**")
          print(f"- executable-shadow mean CLV: **{g['summary']['executableShadow']['meanLineClvPoints']}**")
          print(f"- executable-shadow beat-close rate: **{g['summary']['executableShadow']['beatCloseRate']}**")
          print("## Registered CLV gates")
          print(f"- directional: **{dg['verdict']}**, n={dg['gradeable']}, weeks={dg['week_clusters']}, mean={dg['mean_clv']}, max e-value={dg['max_e_value']}")
          print(f"- executable shadow: **{eg['verdict']}**, n={eg['gradeable']}, weeks={eg['week_clusters']}, mean={eg['mean_clv']}, max e-value={eg['max_e_value']}")
          print("## Registered S02 authority")
          print(f"- all gates pass: **{a['summary']['allRegisteredGatesPass']}**")
          print(f"- failed: **{a['summary']['recomputedFailedGates']}**")
          print("- CLV is research context only; no automatic promotion.")
          PY

      - name: Publish CLV evidence
        if: steps.active.outputs.run == '1'
        working-directory: evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             data/week6-clv-close-capture/             data/week6-clv-close-report.json             data/week6-clv-grades.json             data/authority-gate-audit.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Week 6 CLV grading $(date -u '+%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3; do
            git fetch origin capture-data
            if git rebase origin/capture-data && git push origin HEAD:capture-data; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
