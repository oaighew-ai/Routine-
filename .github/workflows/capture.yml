# The capture, running where it can actually reach the exchange.
#
# This is the only thing in the repository that produces observations, and it
# had never run. The reason was a chain of wrong assumptions rather than one
# bug: the parser had never seen a real response, `capture.bat` exited before
# it started, and every session concluded from its own blocked egress that no
# environment could reach Kalshi. A GitHub-hosted runner reaches it fine.
#
# Timing is not decoration. The strategy's only measured edge is +0.44 points
# of closing line value against the OPENING number and nothing at all against
# the current one, so a line captured on Wednesday is a line whose value
# someone else already took. `RELEASE_WINDOW_UTC` in cfb_edge/watch.py puts the
# window at Friday 18:00 UTC through Tuesday 18:00 UTC, and these crons cover
# exactly that.
#
# Every thirty minutes rather than every ten. Scheduled events are best effort:
# of roughly twelve slots in the first window GitHub delivered one, and of six
# the following hour, none. Frequency is not what the capture needs anyway.
# First-seen means the first successful poll sets the number and the rest only
# measure movement, and movement runs about 0.10 points a day against an edge
# of 0.44, so half an hour of drift costs about 0.002 points. What matters is
# that at least one poll lands, so a missed slot must stay survivable and the
# run is dispatchable by hand.
#
# Scheduled workflows only run from the default branch, so this file has to
# live on main to fire at all.
name: capture

on:
  # Manual fallback only. The continuous open-loop worker owns scheduled
  # production capture. Scheduling this workflow too put 15-minute jobs behind
  # a 5.5-hour worker in the same cfb-capture concurrency group; GitHub then
  # replaced queued runs, creating cancellation noise without adding a single
  # observation. Keep this path for operator recovery/debug only.
  workflow_dispatch:

# `actions: write` is for one thing: asking for the open loop when none is
# running (the last step).
permissions:
  contents: write
  actions: write

# Runs must not overlap: two of them would race to push the same log and one
# would lose its poll. Queued rather than cancelled where possible.
concurrency:
  group: cfb-capture
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Code
        uses: actions/checkout@v4

      - name: The log so far
        uses: actions/checkout@v4
        with:
          ref: capture-data
          path: capture-data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # `--week opening`, not the default `current`. `current_week` answers
      # which slate is being PLAYED, and week three's last kickoff is a
      # Saturday 11pm ET game that reads as Sunday 03:00 UTC, so it holds week
      # three until Monday 00:00 UTC. The window opens Sunday 22:00 UTC. The
      # first scheduled run polled a board that had already moved to week four,
      # matched nothing, and recorded nothing. `opening_week` answers which
      # week can still be recorded at its open, which is the question.
      - name: Build the slate for the week that can still be captured
        id: slate
        run: |
          # `set +e` around the pipeline on purpose: the step runs under
          # `bash -e`, so a non-zero slate would abort here and never reach the
          # case that tells "no week to capture" apart from "broken".
          set -o pipefail
          set +e
          python3 -m cfb_edge.slate --season "$(date -u +%Y)" --week opening \
            --out capture-data/data/slate_current.csv 2>&1 | tee /tmp/slate.log
          rc=$?
          set -e
          case "$rc" in
            0)
              echo "ok=1" >> "$GITHUB_OUTPUT"
              ;;
            3)
              # No week is open for capture. That is the right answer out of
              # season, not a failure, so this stops rather than going red
              # every half hour for nine months.
              echo "ok=0" >> "$GITHUB_OUTPUT"
              echo "No week is open for capture; nothing to poll." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "Slate generation failed; see logs. No successful capture claimed." >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac

      - name: Repeated polls around the scheduled trigger
        id: poll
        if: steps.slate.outputs.ok == '1'
        timeout-minutes: 12
        run: |
          for attempt in 1 2 3; do
            python3 -m cfb_edge.watch --source kalshi \
              --slate capture-data/data/slate_current.csv \
              --log capture-data/data/opens.jsonl.gz \
              --out capture-data/data/opens.csv --once
            [ "$attempt" -eq 3 ] || sleep 240
          done

      - name: Build read-only capture report
        if: always()
        env:
          CAPTURE_OUTCOME: ${{ steps.poll.outcome }}
        run: |
          python3 -m cfb_edge.capture_report \
            --log capture-data/data/opens.jsonl.gz \
            --slate capture-data/data/slate_current.csv \
            --out capture-data/data \
            --capture-outcome "$CAPTURE_OUTCOME" --revision "$GITHUB_SHA"

      - name: Build offline diagnostics (live picks belong to the private Site)
        if: always()
        run: |
          args=(
            --authority config/delivery_authority.json
            --registry config/model_registry.json
            --capture-report capture-data/data/capture-report.json
            --previous capture-data/data/picks-diagnostic.json
            --out capture-data/data/picks-diagnostic.json
            --revision "$GITHUB_SHA"
          )
          if [ -f capture-data/ledger/candidates.jsonl ]; then
            args+=(--candidates capture-data/ledger/candidates.jsonl)
          fi
          python3 -m cfb_edge.source_of_truth "${args[@]}"

      - name: Retain diagnostic report even when capture fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            capture-data/data/capture-report.*
            capture-data/data/picks-diagnostic.json
          if-no-files-found: error
          retention-days: 30

      - name: Record what the log now holds
        if: steps.slate.outputs.ok == '1'
        run: |
          GAMES=$(( $(wc -l < capture-data/data/opens.csv) - 1 ))
          {
            echo "last poll : $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "run       : ${{ github.run_id }}"
            echo "games with a first-seen line: $GAMES"
          } > capture-data/data/status.txt
          echo "- games with a first-seen line: **$GAMES**" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep it
        if: steps.slate.outputs.ok == '1'
        working-directory: capture-data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "nothing new this poll" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -q -m "capture $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Serialised by `concurrency`, so a conflict means something unusual.
          # Re-poll against the branch as it actually is rather than forcing:
          # the first-seen guarantee is the whole point and force would break it.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected, rebuilding on the current branch (attempt $attempt)"
            git reset --hard HEAD~1
            git fetch origin capture-data
            git reset --hard origin/capture-data
            cd "$GITHUB_WORKSPACE"
            python3 -m cfb_edge.watch --source kalshi \
              --slate capture-data/data/slate_current.csv \
              --log capture-data/data/opens.jsonl.gz \
              --out capture-data/data/opens.csv --once
            python3 -m cfb_edge.capture_report \
              --log capture-data/data/opens.jsonl.gz \
              --slate capture-data/data/slate_current.csv \
              --out capture-data/data --revision "$GITHUB_SHA"
            args=(
              --authority config/delivery_authority.json
              --registry config/model_registry.json
              --capture-report capture-data/data/capture-report.json
              --previous capture-data/data/picks-diagnostic.json
              --out capture-data/data/picks-diagnostic.json
              --revision "$GITHUB_SHA"
            )
            if [ -f capture-data/ledger/candidates.jsonl ]; then
              args+=(--candidates capture-data/ledger/candidates.jsonl)
            fi
            python3 -m cfb_edge.source_of_truth "${args[@]}"
            cd capture-data
            git add -A data
            git diff --cached --quiet && exit 0
            git commit -q -m "capture $(date -u '+%Y-%m-%d %H:%M UTC')"
          done
          echo "could not push after three attempts" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # The open loop carries itself from link to link (D38). A link that was
      # cancelled, that failed, or whose queued successor was displaced by one
      # of these runs leaves nothing polling until a cron launch arrives, and
      # those arrive hours late. This job shares the loop's concurrency group,
      # so it only ever runs when no loop does. If it polled successfully
      # inside the release window it asks for a loop. The request queues
      # behind this job and replaces a loop already queued, which is the same
      # loop. A run whose own poll failed asks for nothing, so a broken
      # exchange or schedule cannot turn this into a relaunch circle (D44).
      - name: Restart the open loop if none is running
        if: ${{ !cancelled() && steps.slate.outputs.ok == '1' && steps.poll.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
        run: |
          set -u
          note () { echo "$1"; echo "- loop: $1" >> "$GITHUB_STEP_SUMMARY"; }
          if ! python3 -m cfb_edge.watch --window-open ${RESTART_AT:+--at "$RESTART_AT"}; then
            note "release window closed; no loop requested"
            exit 0
          fi
          if gh workflow run capture-open-loop.yml --ref "$REF"; then
            note "open loop requested on $REF"
          else
            note "could not request the open loop; the crons remain"
          fi
