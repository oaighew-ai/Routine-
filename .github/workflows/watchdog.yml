# The watchdog: the one thing standing between this project and v1's failure.
#
# v1 did not fail on modelling. It failed because scans never ran: 24 playoff
# games, zero bets placed, no calibration data, and nothing anywhere said so.
# The whole point of automation here is that nothing depends on the owner
# remembering, and that is only true if something notices when the automation
# stops.
#
# So this reads the newest run receipt on the data branch and opens an issue
# when it is older than its slate-aware window, when it is missing entirely, or
# when the run it describes failed. It never commits (BUILD_PROMPT §4).
name: watchdog

on:
  schedule:
    - cron: "17 13 * * *"     # daily, after the 10:00 ET grade window
    - cron: "17 1 * 9-12 0,1" # and overnight through the CFB season
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: The ledger, if it exists yet
        id: ledger
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: capture-data
          path: capture-data

      - name: Is the automation alive?
        id: verdict
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, ".")
          from cfb_edge.runner import latest_receipt, receipt_is_stale

          # Slate-aware: six hours inside the CFB week, a day otherwise. A scan
          # that is three hours late on a Saturday morning has already missed
          # its window; the same lateness on a Wednesday has cost nothing.
          import datetime as dt
          now = dt.datetime.now(dt.timezone.utc)
          in_season = now.month in (9, 10, 11, 12, 1)
          weekend = now.weekday() in (3, 4, 5, 6)   # Thu-Sun
          window = 6 * 3600 if (in_season and weekend) else 26 * 3600

          receipt = latest_receipt("capture-data/ledger/runs")
          stale, why = receipt_is_stale(receipt, window_seconds=window, now=now)
          mode = (receipt or {}).get("mode", "unknown")

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"stale={'true' if stale else 'false'}\n")
              fh.write(f"why={why}\n")
              fh.write(f"mode={mode}\n")
              fh.write(f"window_hours={window // 3600}\n")
          summary = f"latest receipt: {why} (window {window // 3600}h, mode {mode})"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(f"- {summary}\n")
          PY

      - name: Open an issue
        if: steps.verdict.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WHY: ${{ steps.verdict.outputs.why }}
          WINDOW: ${{ steps.verdict.outputs.window_hours }}
        run: |
          TITLE="EDGE OS automation is not running"
          # One open issue, not one per firing. A watchdog that files daily
          # duplicates is a watchdog everybody mutes, which is the same as not
          # having one.
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
                       --json number --jq '.[0].number' || echo "")
          BODY=$(cat <<EOF
          The watchdog could not confirm a recent successful run.

          **What it found:** $WHY
          **Window applied:** ${WINDOW}h (six hours inside the CFB weekend, a day otherwise)

          v1 failed this exact way: the modelling was fine and the scans never ran,
          over 24 playoff games, with nothing to say so. Check the \`edge-scan\` and
          \`edge-grade\` routines at claude.ai/code/routines, run one now, and read
          the transcript rather than the status tick.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_
          EOF
          )
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
