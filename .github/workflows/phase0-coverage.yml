# Phase 0 items 2, 3 and 4, answered where the network actually reaches.
#
# These three questions need live pulls: the Odds API plan tier and credit burn,
# a venue-by-sport-by-market coverage matrix, and whether the scoresandodds CFB
# consensus page parses. No Claude Code session in this project's container can
# answer them, because its egress proxy refuses api.the-odds-api.com,
# api.elections.kalshi.com and www.scoresandodds.com outright. A GitHub-hosted
# runner reaches all three.
#
# This is the same lesson `kalshi-truth.yml` was written for and it is worth
# restating: the Kalshi parser was written against a documented shape it had
# never seen, was wrong in three ways at once, and because the request itself
# succeeded the capture reported no error and parsed zero markets. A coverage
# matrix asserted from documentation is that bug waiting to happen.
#
# The job never fails, so the diagnostics always land even when the answer is
# bad news. Read the step summary, not the status tick.
name: phase0 coverage

# Phase 0 items 2 to 4 are now answered (DECISIONS.md D7, D8, D9), so this runs
# on demand only.
#
# It carried a branch-scoped `push` trigger to get those answers, because a
# `workflow_dispatch` workflow is only dispatchable once its file is on the
# default branch — confirmed, not assumed: the dispatch API answers this one
# with a 404. That trigger has been removed, and the reason is the measurement
# it produced: the plan is the free tier, 500 credits a month, and each run of
# this job spends 6 (two sports x three markets). Its `paths` filter included
# `cfb_edge/providers/oddsapi.py`, a file under active development, so every
# edit to the odds client quietly cost 6 credits out of an allowance that
# cannot afford the capture schedule in the first place.
#
# Re-running before this merges does not need a trigger: the Actions API will
# re-run a previous run of this workflow on demand, and a re-run reads current
# secrets, which is how the key was verified. After it merges, Run workflow
# appears in the UI.
on:
  workflow_dispatch:
    inputs:
      bookmakers:
        description: "Bookmaker keys, comma separated, 10 or fewer (billed as one region)"
        default: "kalshi,pinnacle,draftkings,fanduel,betmgm,betrivers"
        required: false
      sports:
        description: "Sport keys, comma separated"
        default: "americanfootball_ncaaf,basketball_nba"
        required: false

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Plan tier and credit burn (Phase 0 item 2)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, urllib.request, urllib.error
          key = os.environ.get("ODDS_API_KEY", "")
          print("## Plan and credits\n")
          if not key:
              print("- `ODDS_API_KEY` is not set as a repository secret, so items 2 "
                    "and 3 cannot be answered. Add it and re-run.")
              raise SystemExit(0)
          # /sports is not billed, and still returns the quota headers.
          url = f"https://api.the-odds-api.com/v4/sports/?apiKey={key}"
          try:
              with urllib.request.urlopen(url, timeout=30) as r:
                  sports = json.loads(r.read())
                  h = {k.lower(): v for k, v in r.headers.items()}
          except urllib.error.HTTPError as e:
              print(f"- HTTP {e.code} from the API. A 401 means the key is wrong; "
                    f"a 429 means the plan is exhausted.")
              raise SystemExit(0)
          print(f"- requests used this period: **{h.get('x-requests-used', '?')}**")
          print(f"- requests remaining: **{h.get('x-requests-remaining', '?')}**")
          print(f"- this call cost: {h.get('x-requests-last', '0')}")
          print(f"- sports the key can see: **{len(sports)}**")
          print("")
          print("The plan tier is not returned by the API; infer it from the "
                "remaining count and confirm it on the account page. Historical "
                "odds, which A3 and A4 need for closes and lag prices, are "
                "paid-plan only and cost 10 credits per region per market.")
          print("")
          print("Measured burn already on record in `cfb_edge/providers/oddsapi.py`: "
                "the existing CFB capture on `regions=us,us2,eu` costs 3 credits a "
                "poll and makes 652 polls in a regular-season week, about **1,956 a "
                "week and 8,400 a month**. Requesting by `bookmakers` instead bills "
                "as one region, cutting that to a third.")
          PY

      - name: Coverage matrix (Phase 0 item 3)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # `inputs` is empty on a push event, so the defaults are repeated
          # here. Without this the matrix silently requests no books and no
          # sports and reports an empty board, which reads exactly like a
          # venue that lists nothing.
          BOOKMAKERS: ${{ inputs.bookmakers || 'kalshi,pinnacle,draftkings,fanduel,betmgm,betrivers' }}
          SPORTS: ${{ inputs.sports || 'americanfootball_ncaaf,basketball_nba' }}
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, sys
          sys.path.insert(0, ".")
          from cfb_edge.providers.oddsapi import fetch_pull, OddsApiUnreachable

          print("\n## Coverage matrix: venue by sport by market\n")
          if not os.environ.get("ODDS_API_KEY"):
              print("- no key; skipped.")
              raise SystemExit(0)

          books = [b.strip() for b in os.environ["BOOKMAKERS"].split(",") if b.strip()]
          sports = [s.strip() for s in os.environ["SPORTS"].split(",") if s.strip()]
          print(f"Requested by `bookmakers` ({len(books)} keys), not by region. "
                f"Region `us` alone omits Kalshi (`us_ex`) and Pinnacle (`eu`).\n")

          for sport in sports:
              print(f"### {sport}\n")
              try:
                  pull = fetch_pull(sport=sport, bookmakers=books)
              except OddsApiUnreachable as exc:
                  print(f"- unreachable: {exc}")
                  continue
              print(f"- events: **{len(pull.events)}**, credits remaining "
                    f"{pull.credits_remaining}, this pull cost {pull.last_cost}")
              if not pull.events:
                  print("- no events listed, so the row below means nothing. "
                        "Out of season, or the sport key is wrong.")
                  continue
              seen = {}
              for e in pull.events:
                  for b in e["bookmakers"]:
                      seen.setdefault(b["key"], set()).update(
                          m["key"] for m in b["markets"])
              print("")
              print("| venue | h2h | spreads | totals |")
              print("|---|---|---|---|")
              for book in books:
                  got = seen.get(book)
                  if got is None:
                      print(f"| `{book}` | - | - | - |  (not listed)")
                      continue
                  cells = " | ".join("yes" if m in got else "no"
                                     for m in ("h2h", "spreads", "totals"))
                  print(f"| `{book}` | {cells} |")
              missing = [b for b in books if b not in seen]
              if missing:
                  print(f"\n**Not listed at all: {', '.join(missing)}.** "
                        f"Acceptance check 16 asks for exactly this explanation "
                        f"when the venue's prices do not reach `bookSet`.")
          PY

      - name: Does the scoresandodds CFB page parse? (Phase 0 item 4)
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import collections, re, urllib.request, urllib.error
          print("\n## scoresandodds CFB consensus\n")
          print("§7 says the CFB page may be parsed only after Phase 0 confirms "
                "it. Run 2 found `/ncaaf/consensus` 404s while "
                "`/ncaaf/consensus-picks` returns 200 with 2,647 percentage "
                "strings, and that the `/nba/consensus` control 404s too: the "
                "site is up and the guessed path was wrong, not the site. So "
                "this run stops guessing selectors and reports the shape it "
                "actually receives, which is the whole reason `kalshi-truth.yml` "
                "exists.\n")

          CANDIDATES = [
              ("cfb", "https://www.scoresandodds.com/ncaaf/consensus-picks"),
              ("cfb", "https://www.scoresandodds.com/ncaaf"),
              ("nba control", "https://www.scoresandodds.com/nba/consensus-picks"),
          ]

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": "cfb-edge/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, ""
              except Exception as e:
                  return str(e), ""

          pages = [(label, url) + fetch(url) for label, url in CANDIDATES]

          print("| path | kind | HTTP | bytes | % strings |")
          print("|---|---|---|---|---|")
          for label, url, code, body in pages:
              path = url.replace("https://www.scoresandodds.com", "")
              pct = len(re.findall(r'\d{1,3}%', body))
              print(f"| `{path}` | {label} | {code} | {len(body)} | {pct} |")

          target = next((p for p in pages if p[0] == "cfb" and p[2] == 200), None)
          if target is None:
              print("\n**Answer: no page answers.** Nothing to parse; re-run "
                    "before concluding the source does not exist.")
              raise SystemExit(0)

          body = target[3]
          print(f"\n### Shape of `{target[1]}`\n")
          print("Most frequent attributes and classes, which is what a parser "
                "would key on. Counts only: §4 forbids reading a raw page into "
                "the conversation, and a million bytes of HTML is exactly that.\n")

          attrs = collections.Counter(re.findall(r'\b(data-[a-z0-9-]+)=', body))
          classes = collections.Counter(
              c for group in re.findall(r'class="([^"]{1,200})"', body)
              for c in group.split()
          )
          tags = collections.Counter(re.findall(r'<([a-z][a-z0-9]*)\b', body))

          for title, counter, n in (("data-* attributes", attrs, 12),
                                    ("classes", classes, 15),
                                    ("tags", tags, 8)):
              top = counter.most_common(n)
              print(f"- **{title}**: " + (", ".join(f"`{k}` x{v}" for k, v in top)
                                          if top else "none found"))

          # One short window around a percentage, so the next person can see how
          # a consensus figure is actually wrapped without opening the page.
          window = None
          for m in re.finditer(r'\d{1,3}%', body):
              start, stop = max(0, m.start() - 220), min(len(body), m.end() + 80)
              chunk = re.sub(r'\s+', ' ', body[start:stop])
              if 'class=' in chunk or 'data-' in chunk:
                  window = chunk
                  break
          if window:
              print("\n- **A percentage in context** (one 300-character window):")
              print("\n```html\n" + window + "\n```")

          print("\n**Answer: the CFB consensus page exists** at "
                "`/ncaaf/consensus-picks`. A parser is now a bounded job against "
                "the shape above rather than a guess. Record the path and the "
                "chosen selector in DECISIONS.md before writing one.")
          PY

      - name: Keep the evidence
        if: always()
        run: echo "Read the step summary above; nothing here is committed."
